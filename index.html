<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scan Barcode</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:stretch}
#header{padding:24px 18px 10px;text-align:center;flex-shrink:0}
#header h1{font-size:1.3rem;font-weight:700}
#hint{color:#8b949e;font-size:.85rem;margin-top:6px;line-height:1.5}
#reader{flex:1;overflow:hidden;background:#111;display:none}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#startWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
#startBtn{padding:20px 48px;background:#238636;border:none;color:#fff;border-radius:14px;font-size:1.2rem;font-weight:700;cursor:pointer;touch-action:manipulation;width:100%;max-width:320px}
#startBtn:active{background:#2ea043}
#status{text-align:center;padding:14px 18px;font-size:.9rem;color:#8b949e;flex-shrink:0;min-height:52px}
#status.ok{color:#3fb950}
#status.err{color:#f85149}
#cancelBtn{display:block;margin:0 auto 28px;padding:13px 36px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#e6edf3;border-radius:24px;font-size:1rem;font-weight:600;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<div id="header">
  <h1>📷 Scan Barcode</h1>
  <p id="hint">Tap the button below to start your camera</p>
</div>

<!-- Shown before camera starts — tap triggers getUserMedia (required by iOS) -->
<div id="startWrap">
  <button id="startBtn" onclick="startCamera()">Tap to Start Camera</button>
</div>

<div id="reader"></div>
<div id="status"></div>
<button id="cancelBtn" onclick="cancelScan()">Cancel — Go Back</button>

<script>
var scanner = null;
var scanned = false;

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function startCamera() {
  document.getElementById('startWrap').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  document.getElementById('hint').textContent = 'Point camera at the barcode on the package';
  setStatus('Starting camera…');

  scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    {
      fps: 10,
      qrbox: function(w, h) {
        var s = Math.min(w, h) * 0.72;
        return { width: s, height: Math.round(s * 0.5) };
      }
    },
    function onScanSuccess(code) {
      if (scanned) return;
      scanned = true;
      scanner.stop().catch(function(){});
      setStatus('✅ Scanned! Sending to Food Inventory…', 'ok');
      if (window.opener) {
        window.opener.postMessage({ type: 'blc_barcode', value: code }, '*');
        setTimeout(function() {
          try { window.close(); } catch(e) {}
          setStatus('✅ Done! Switch back to the Food Inventory tab.', 'ok');
        }, 600);
      } else {
        setStatus('Barcode: ' + code + ' — copy this number and go back', 'ok');
      }
    },
    function onScanFailure() {}
  ).then(function() {
    setStatus('Point camera at the barcode');
  }).catch(function(err) {
    document.getElementById('reader').style.display = 'none';
    document.getElementById('startWrap').style.display = 'flex';
    setStatus('⚠️ Camera error: ' + err, 'err');
  });
}

function cancelScan() {
  if (scanner) { try { scanner.stop(); } catch(e) {} }
  try { window.close(); } catch(e) {}
  history.back();
}
</script>
</body>
</html>
